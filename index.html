<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js">
    </script>
    <title>ICT 10</title>

    <style>
        body{
            text-align: center;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            background-image: url(https://i.pinimg.com/1200x/00/d2/f1/00d2f144023573490a4804e91f0e6f34.jpg);
            background-size: cover;
            color:  rgb(8, 44, 4);
            font-size: x-large;
        }

        div.container{
            margin-top: 100px;
            background-color: rgba(152, 200, 141, 0.451);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid rgb(110, 157, 115);
        }

        h1{
            color:rgb(8, 44, 4);
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;

        }

        input.form-control{
            width: 300px;
            margin: 0 auto;
            margin-top: 10px;
        }

        button{
            margin-top: 10px;
            background-color: rgb(96, 130, 101);
            color: rgb(198, 239, 205);
            border: 2px solid rgb(110, 157, 115);
            border-radius: 10px;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            background: rgba(125, 183, 113, 0.35); 
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Non-metal Elements Finder imnida!</h1>
    <p>Enter element symbol</p>

    <input type="text" id="nmetal1" placeholder="Ex: N (Nitrogen)">

    <br>

    <button py-click="find_element">Find Element</button>
    <div class="result">
    <h3> Find Results </h3>
    <p><b>Element Symbol:</b><span id= "symbol"></span></p>
    <p><b>Element Name:</b><span id= "name"></span></p>
    <p><b>Atomic Number:</b><span id= "number"></span></p>
    <p><b>Atomic Mass:</b><span id= "mass"></span></p>
    </div>


    <div id="output1"></div>
    <script type="py" src="main.py"></script>

</div>

</body>
</html>
